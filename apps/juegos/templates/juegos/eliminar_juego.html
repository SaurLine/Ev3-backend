{% extends 'base.html' %}

{% block title %}Eliminar Videojuego - MamboStore{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow p-4 border-0 text-center">
            <h3 class="text-danger fw-bold mb-3">¿Estás seguro?</h3>
            <p class="text-muted">Estás a punto de eliminar el juego <strong>"{{ juego.titulo }}"</strong>. Esta acción no se puede deshacer.</p>
            
            <form method="POST">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3 mt-3">
                    <a href="{% url 'catalogo' %}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
